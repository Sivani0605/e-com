<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mobiles</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f0f2f5;color:#222}
header{background:#0b2166;color:#fff;padding:18px;text-align:center}header h1{margin:0}
.container{display:grid;grid-template-columns:repeat(5,1fr);gap:20px;padding:30px;max-width:1200px;margin:auto}
.card{background:#fff;width:100%;padding:15px;text-align:center;border-radius:12px;box-shadow:0 5px 15px rgba(0,0,0,.12)}
.card img{width:100%;height:170px;object-fit:contain;border-radius:8px;background:#fafafa}
.card h3{color:#0b2166}.desc{min-height:40px;color:#555}
button{padding:9px 14px;border:0;border-radius:7px;cursor:pointer;margin:4px;font-weight:bold}
.cart-btn{background:#2874f0;color:white}.buy-btn{background:#4caf50;color:white}
footer{text-align:center;padding:25px;background:#0b2166;margin-top:30px}footer a{color:white;text-decoration:none}
@media(max-width:1000px){.container{grid-template-columns:repeat(3,1fr)}}
@media(max-width:700px){.container{grid-template-columns:repeat(2,1fr);padding:15px}}
@media(max-width:450px){.container{grid-template-columns:1fr}}
</style></head><body>
<header><h1>Mobiles</h1></header><div class="container"><div class="card">
<img src="mobile1.jpg" alt="Samsung">
<h3>Samsung</h3><p>₹48,000</p><p class="desc">128GB storage, 5000mAh battery</p>
<button class="cart-btn" onclick='addToCart({"name": "Samsung", "category": "Mobile", "img": "mobile1.jpg", "price": "\u20b948,000", "desc": "128GB storage, 5000mAh battery"})'>Add to Cart</button>
<button class="buy-btn" onclick='buyNow({"name": "Samsung", "category": "Mobile", "img": "mobile1.jpg", "price": "\u20b948,000", "desc": "128GB storage, 5000mAh battery"})'>Buy Now</button>
</div><div class="card">
<img src="mobile2.jpg" alt="Vivo X90">
<h3>Vivo X90</h3><p>₹52,000</p><p class="desc">12GB RAM, Zeiss camera, 5G</p>
<button class="cart-btn" onclick='addToCart({"name": "Vivo X90", "category": "Mobile", "img": "mobile2.jpg", "price": "\u20b952,000", "desc": "12GB RAM, Zeiss camera, 5G"})'>Add to Cart</button>
<button class="buy-btn" onclick='buyNow({"name": "Vivo X90", "category": "Mobile", "img": "mobile2.jpg", "price": "\u20b952,000", "desc": "12GB RAM, Zeiss camera, 5G"})'>Buy Now</button>
</div><div class="card">
<img src="mobile3.jpg" alt="Redmi 11 Pro">
<h3>Redmi 11 Pro</h3><p>₹50,000</p><p class="desc">108MP Camera, 120Hz Display</p>
<button class="cart-btn" onclick='addToCart({"name": "Redmi 11 Pro", "category": "Mobile", "img": "mobile3.jpg", "price": "\u20b950,000", "desc": "108MP Camera, 120Hz Display"})'>Add to Cart</button>
<button class="buy-btn" onclick='buyNow({"name": "Redmi 11 Pro", "category": "Mobile", "img": "mobile3.jpg", "price": "\u20b950,000", "desc": "108MP Camera, 120Hz Display"})'>Buy Now</button>
</div><div class="card">
<img src="mobile4.png" alt="Oppo">
<h3>Oppo</h3><p>₹69,000</p><p class="desc">6.7-inch AMOLED, AI Camera</p>
<button class="cart-btn" onclick='addToCart({"name": "Oppo", "category": "Mobile", "img": "mobile4.png", "price": "\u20b969,000", "desc": "6.7-inch AMOLED, AI Camera"})'>Add to Cart</button>
<button class="buy-btn" onclick='buyNow({"name": "Oppo", "category": "Mobile", "img": "mobile4.png", "price": "\u20b969,000", "desc": "6.7-inch AMOLED, AI Camera"})'>Buy Now</button>
</div><div class="card">
<img src="mobile5.jpg" alt="Iphone">
<h3>Iphone</h3><p>₹88,000</p><p class="desc">A15 Bionic, Super Retina XDR</p>
<button class="cart-btn" onclick='addToCart({"name": "Iphone", "category": "Mobile", "img": "mobile5.jpg", "price": "\u20b988,000", "desc": "A15 Bionic, Super Retina XDR"})'>Add to Cart</button>
<button class="buy-btn" onclick='buyNow({"name": "Iphone", "category": "Mobile", "img": "mobile5.jpg", "price": "\u20b988,000", "desc": "A15 Bionic, Super Retina XDR"})'>Buy Now</button>
</div></div>
<footer><a href="index.html">← Back to Home</a> | <a href="index.html">🛒 Open Cart</a></footer>
<script>
function addToCart(product){
 let cart=JSON.parse(localStorage.getItem('cart')||'[]');
 if(cart.some(p=>p.name===product.name)){alert(product.name+' is already in your cart.');return;}
 cart.push(product);localStorage.setItem('cart',JSON.stringify(cart));alert(product.name+' added to cart!');
}
function buyNow(product){
 localStorage.setItem('buyNow',JSON.stringify(product));window.location.href='index.html#checkout';
}
</script></body></html>
