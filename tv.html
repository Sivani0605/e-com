<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TV</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f0f2f5;color:#222}
header{background:#0b2166;color:#fff;padding:18px;text-align:center}header h1{margin:0}
.container{display:grid;grid-template-columns:repeat(5,1fr);gap:20px;padding:30px;max-width:1200px;margin:auto}
.card{background:#fff;width:100%;padding:15px;text-align:center;border-radius:12px;box-shadow:0 5px 15px rgba(0,0,0,.12)}
.card img{width:100%;height:170px;object-fit:contain;border-radius:8px;background:#fafafa}
.card h3{color:#0b2166}.desc{min-height:40px;color:#555}
button{padding:9px 14px;border:0;border-radius:7px;cursor:pointer;margin:4px;font-weight:bold}
.cart-btn{background:#2874f0;color:white}.buy-btn{background:#4caf50;color:white}
footer{text-align:center;padding:25px;background:#0b2166;margin-top:30px}footer a{color:white;text-decoration:none}
@media(max-width:1000px){.container{grid-template-columns:repeat(3,1fr)}}
@media(max-width:700px){.container{grid-template-columns:repeat(2,1fr);padding:15px}}
@media(max-width:450px){.container{grid-template-columns:1fr}}
</style></head><body>
<header><h1>TV</h1></header><div class="container"><div class="card">
<img src="tv1.jpg" alt="Samsung TV">
<h3>Samsung TV</h3><p>₹66,000</p><p class="desc">55-inch 4K UHD Smart TV</p>
<button class="cart-btn" onclick='addToCart({"name": "Samsung TV", "category": "TV", "img": "tv1.jpg", "price": "\u20b966,000", "desc": "55-inch 4K UHD Smart TV"})'>Add to Cart</button>
<button class="buy-btn" onclick='buyNow({"name": "Samsung TV", "category": "TV", "img": "tv1.jpg", "price": "\u20b966,000", "desc": "55-inch 4K UHD Smart TV"})'>Buy Now</button>
</div><div class="card">
<img src="tv2.jpg" alt="Sony">
<h3>Sony</h3><p>₹55,000</p><p class="desc">50-inch Full HD Smart TV</p>
<button class="cart-btn" onclick='addToCart({"name": "Sony", "category": "TV", "img": "tv2.jpg", "price": "\u20b955,000", "desc": "50-inch Full HD Smart TV"})'>Add to Cart</button>
<button class="buy-btn" onclick='buyNow({"name": "Sony", "category": "TV", "img": "tv2.jpg", "price": "\u20b955,000", "desc": "50-inch Full HD Smart TV"})'>Buy Now</button>
</div><div class="card">
<img src="tv3.jpg" alt="LG">
<h3>LG</h3><p>₹53,000</p><p class="desc">43-inch 4K AI ThinQ Smart TV</p>
<button class="cart-btn" onclick='addToCart({"name": "LG", "category": "TV", "img": "tv3.jpg", "price": "\u20b953,000", "desc": "43-inch 4K AI ThinQ Smart TV"})'>Add to Cart</button>
<button class="buy-btn" onclick='buyNow({"name": "LG", "category": "TV", "img": "tv3.jpg", "price": "\u20b953,000", "desc": "43-inch 4K AI ThinQ Smart TV"})'>Buy Now</button>
</div><div class="card">
<img src="tv4.jpg" alt="Vizio">
<h3>Vizio</h3><p>₹61,000</p><p class="desc">50-inch 4K HDR Chromecast TV</p>
<button class="cart-btn" onclick='addToCart({"name": "Vizio", "category": "TV", "img": "tv4.jpg", "price": "\u20b961,000", "desc": "50-inch 4K HDR Chromecast TV"})'>Add to Cart</button>
<button class="buy-btn" onclick='buyNow({"name": "Vizio", "category": "TV", "img": "tv4.jpg", "price": "\u20b961,000", "desc": "50-inch 4K HDR Chromecast TV"})'>Buy Now</button>
</div><div class="card">
<img src="tv5.jpg" alt="Xiaomi">
<h3>Xiaomi</h3><p>₹69,000</p><p class="desc">55-inch Mi TV, Bezel-less 4K</p>
<button class="cart-btn" onclick='addToCart({"name": "Xiaomi", "category": "TV", "img": "tv5.jpg", "price": "\u20b969,000", "desc": "55-inch Mi TV, Bezel-less 4K"})'>Add to Cart</button>
<button class="buy-btn" onclick='buyNow({"name": "Xiaomi", "category": "TV", "img": "tv5.jpg", "price": "\u20b969,000", "desc": "55-inch Mi TV, Bezel-less 4K"})'>Buy Now</button>
</div></div>
<footer><a href="index.html">← Back to Home</a> | <a href="index.html">🛒 Open Cart</a></footer>
<script>
function addToCart(product){
 let cart=JSON.parse(localStorage.getItem('cart')||'[]');
 if(cart.some(p=>p.name===product.name)){alert(product.name+' is already in your cart.');return;}
 cart.push(product);localStorage.setItem('cart',JSON.stringify(cart));alert(product.name+' added to cart!');
}
function buyNow(product){
 localStorage.setItem('buyNow',JSON.stringify(product));window.location.href='index.html#checkout';
}
</script></body></html>
