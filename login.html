<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <style>
    body {
      margin: 100px;
      background: bisque;
      font-family: Arial, sans-serif;
    }
    .login-box {
      max-width: 400px;
      margin: 60px auto;
      background: beige;
      padding: 30px;
      border-radius: 10px;
    }
    .login-box h2 {
      text-align: center;
      margin-bottom: 25px;
      color: coral;
    }
    .login-box input {
      width: 95%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    .login-btn {
      width: 100%;
      padding: 12px;
      background-color: coral;
      color: black;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
    }
    .error {
      color: red;
      text-align: center;
      font-weight: bold;
      margin-top: 10px;
    }
    a {
      color: coral;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Login</h2>
    <form id="loginForm">
      <input type="email" id="email" placeholder="Email" required><br>
      <input type="password" id="password" placeholder="Password" required><br>
      <button type="submit" class="login-btn">Login</button>
      <div id="errorMessage" class="error"></div>
      <p style="text-align:center; margin-top:10px;">
        Don’t have an account? <a href="register.html">Register</a>
      </p>
    </form>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', function(event) {
      event.preventDefault();
      const enteredEmail = document.getElementById('email').value;
      const enteredPassword = document.getElementById('password').value;
      const storedUser = JSON.parse(localStorage.getItem('user'));
      if (!storedUser) {
        document.getElementById('errorMessage').textContent = "No user found. Please register first.";
        return;
      }
      if (enteredEmail === storedUser.email && enteredPassword === storedUser.password) {    
        window.location.href = "index.html";
      } else {
        document.getElementById('errorMessage').textContent = "Invalid email or password!";
      }
    });
  </script>
</body>
</html>
